name: Frontend und Backend veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Only for a verified no-schema-change recovery deployment"
        required: false
        default: false
        type: boolean
      diagnose_migration_locks:
        description: "Read active PostgreSQL advisory locks during a recovery deployment"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Frontend auschecken
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend installieren, prüfen und bauen
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run audit:i18n
          npm run build

      - name: Backend auschecken
        uses: actions/checkout@v6
        with:
          repository: davidk15042001/Lulu-Growth-OS-Backend
          ref: main
          path: backend-source

      - name: Frontend/Backend-Verträge und Routing prüfen
        env:
          LULU_BACKEND_PATH: backend-source
        run: |
          npm run audit:api
          npm run audit:routing

      - name: Backend-Abhängigkeiten prüfen
        working-directory: backend-source
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test:migrations
          npm test
          npm run build
          npm run test:smoke

      - name: SSH einrichten
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo 'DEPLOY_HOST is missing'; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo 'DEPLOY_SSH_KEY is missing'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\r$//; s/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            if printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519.base64 2>/dev/null \
              && chmod 600 ~/.ssh/id_ed25519.base64 \
              && ssh-keygen -y -f ~/.ssh/id_ed25519.base64 >/dev/null 2>&1; then
              mv ~/.ssh/id_ed25519.base64 ~/.ssh/id_ed25519
            else
              echo 'DEPLOY_SSH_KEY is neither a valid OpenSSH key nor valid base64-encoded key material.'
              exit 1
            fi
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Frontend hochladen
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER" || { echo 'DEPLOY_USER is missing'; exit 1; }
          rsync -rz --links --delete dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/lulu-ai.cn/html/"

      - name: Backend hochladen, migrieren und starten
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations || 'false' }}
          DIAGNOSE_MIGRATION_LOCKS: ${{ inputs.diagnose_migration_locks || 'false' }}
        run: |
          set -euo pipefail
          rsync -rz --links --delete \
            --exclude .env \
            --exclude .git \
            --exclude node_modules \
            --exclude '.deploy-stale-node_modules-*' \
            backend-source/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/lulu-growth-os/backend/"
          # Keep the SSH transport alive while an otherwise long-running
          # production migration is executing.
          remote_skip_migrations="$(printf '%q' "$SKIP_MIGRATIONS")"
          remote_diagnose_migration_locks="$(printf '%q' "$DIAGNOSE_MIGRATION_LOCKS")"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "SKIP_MIGRATIONS=$remote_skip_migrations DIAGNOSE_MIGRATION_LOCKS=$remote_diagnose_migration_locks bash -se" <<'REMOTE'
          set -euo pipefail
          cd /var/www/lulu-growth-os/backend

          # A previously interrupted Actions SSH session can leave only its
          # one-off migration runner alive, holding the global migration lock
          # while the web service itself remains healthy. It is safe to end
          # that exact stale runner before starting the new migration; this
          # never targets the running API service (dist/server.js).
          stale_migration_pids="$(pgrep -f 'dist/database/run\.js' || true)"
          if [ -n "$stale_migration_pids" ]; then
            echo "Stopping stale one-off migration runner before deployment"
            kill $stale_migration_pids || true
            for attempt in $(seq 1 10); do
              pgrep -f 'dist/database/run\.js' >/dev/null || break
              sleep 1
            done
            remaining_migration_pids="$(pgrep -f 'dist/database/run\.js' || true)"
            if [ -n "$remaining_migration_pids" ]; then
              echo "Force-stopping unresponsive stale migration runner"
              kill -KILL $remaining_migration_pids || true
              sleep 1
            fi
            if pgrep -f 'dist/database/run\.js' >/dev/null; then
              echo "A stale migration runner could not be stopped; refusing to restart the API behind its lock" >&2
              exit 1
            fi
          fi

          if ! npm ci --omit=dev --ignore-scripts; then
            test -d node_modules || { echo "npm ci failed before node_modules was created" >&2; exit 1; }
            stale_path=".deploy-stale-node_modules-$(date +%Y%m%d%H%M%S)"
            echo "Recovering from incompatible node_modules ownership: moving it to $stale_path"
            mv node_modules "$stale_path"
            npm ci --omit=dev --ignore-scripts
          fi

          if [ "$DIAGNOSE_MIGRATION_LOCKS" = "true" ]; then
            # Emit only lock metadata, never SQL text or environment values.
            # This is read-only and is available only through an explicit
            # recovery deployment when a migration lock must be diagnosed.
            node --input-type=module <<'NODE'
            import { getPool } from './dist/db/pool.js';

            const pool = getPool();
            try {
              const { rows } = await pool.query(`
                SELECT
                  activity.pid,
                  activity.application_name,
                  activity.backend_type,
                  activity.state,
                  activity.wait_event_type,
                  activity.wait_event,
                  activity.backend_start,
                  activity.xact_start,
                  activity.query_start,
                  locks.classid::text AS class_id,
                  locks.objid::text AS object_id,
                  locks.objsubid AS object_sub_id
                FROM pg_locks AS locks
                JOIN pg_stat_activity AS activity ON activity.pid = locks.pid
                WHERE locks.locktype = 'advisory' AND locks.granted
                ORDER BY activity.backend_start ASC
              `);
              console.log(JSON.stringify({ advisoryLocks: rows }));
            } finally {
              await pool.end();
            }
            NODE
          fi

          if [ "$SKIP_MIGRATIONS" = "true" ]; then
            echo "Skipping migrations for this explicitly verified no-schema-change recovery deployment"
          else
            node dist/database/run.js
          fi
          if [ "$(id -u)" -eq 0 ]; then
            systemctl restart lulu-growth-backend
          else
            sudo -n /usr/local/sbin/lulu-growth-backend-restart
          fi

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/ready >/tmp/lulu-ready.json; then
              cat /tmp/lulu-ready.json
              exit 0
            fi
            sleep 2
          done

          echo "Backend readiness check failed on port 3000" >&2
          # The API has not started, so collect only service state and recent
          # unit errors. This avoids exposing deployment secrets while making
          # a failed recovery deploy actionable in the Actions log.
          systemctl show lulu-growth-backend --no-pager \
            -p ActiveState -p SubState -p Result -p MainPID \
            -p ExecMainCode -p ExecMainStatus -p ActiveEnterTimestamp \
            -p StateChangeTimestamp || true
          pgrep -a -f 'dist/(server|database/run)\.js' || true
          if [ "$(id -u)" -eq 0 ]; then
            systemctl status lulu-growth-backend --no-pager --full || true
            journalctl -u lulu-growth-backend --no-pager -n 120 \
              | grep -Ei 'error|fatal|exception|failed|migration|listen|database|exit|ready' \
              || true
          else
            sudo -n systemctl status lulu-growth-backend --no-pager --full || true
            sudo -n journalctl -u lulu-growth-backend --no-pager -n 120 \
              | grep -Ei 'error|fatal|exception|failed|migration|listen|database|exit|ready' \
              || true
          fi
          exit 1
          REMOTE
