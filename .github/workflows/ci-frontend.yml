name: Frontend prüfen

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run typecheck
      - run: npm run audit:routing
      - run: npm run audit:api
        env:
          LULU_ALLOW_MISSING_BACKEND: 'true'
      - run: npm run audit:branding
      - run: npm run audit:ai-wallet
      - run: npm run audit:i18n
      - run: npm run audit:feedback
      - run: npm run audit:errors
      - run: npm run audit:agentic-ui
      - run: npm run build
      - run: npm run audit:bundle
