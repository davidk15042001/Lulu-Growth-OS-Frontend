name: Frontend und Backend veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Frontend auschecken
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend installieren, prüfen und bauen
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run audit:i18n
          npm run build

      - name: Backend auschecken
        uses: actions/checkout@v6
        with:
          repository: davidk15042001/Lulu-Growth-OS-Backend
          ref: main
          path: backend-source

      - name: Backend-Abhängigkeiten prüfen
        working-directory: backend-source
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test:migrations
          npm test
          npm run build
          npm run test:smoke

      - name: SSH einrichten
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo 'DEPLOY_HOST is missing'; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo 'DEPLOY_SSH_KEY is missing'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\r$//; s/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            if printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519.base64 2>/dev/null \
              && chmod 600 ~/.ssh/id_ed25519.base64 \
              && ssh-keygen -y -f ~/.ssh/id_ed25519.base64 >/dev/null 2>&1; then
              mv ~/.ssh/id_ed25519.base64 ~/.ssh/id_ed25519
            else
              echo 'DEPLOY_SSH_KEY is neither a valid OpenSSH key nor valid base64-encoded key material.'
              exit 1
            fi
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Frontend hochladen
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER" || { echo 'DEPLOY_USER is missing'; exit 1; }
          rsync -rz --links --delete dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/lulu-ai.cn/html/"

      - name: Backend hochladen, migrieren und starten
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          rsync -rz --links --delete \
            --exclude .env \
            --exclude .git \
            --exclude node_modules \
            backend-source/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/lulu-growth-os/backend/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e; cd /var/www/lulu-growth-os/backend; npm ci --omit=dev --ignore-scripts; node dist/database/run.js; if [ "$(id -u)" -eq 0 ]; then systemctl restart lulu-growth-backend; else sudo -n /usr/local/sbin/lulu-growth-backend-restart; fi; for attempt in $(seq 1 30); do if curl -fsS http://127.0.0.1:3000/api/v1/ready >/tmp/lulu-ready.json; then cat /tmp/lulu-ready.json; exit 0; fi; sleep 2; done; echo "Backend readiness check failed on port 3000" >&2; exit 1'
