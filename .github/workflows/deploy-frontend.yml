name: Frontend auf AWS veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lulu-aws-frontend-production
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  FRONTEND_DOMAIN: https://lulu-ai.tech
  API_BASE_URL: https://api.lulu-ai.tech/api/v1

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Frontend auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: AWS-Zugang über OIDC konfigurieren
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_FRONTEND }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Frontend installieren, prüfen und bauen
        env:
          VITE_API_URL: ${{ env.API_BASE_URL }}
          VITE_RELEASE_SHA: ${{ github.sha }}
          LULU_ALLOW_MISSING_BACKEND: 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm audit --audit-level=high
          npm run check
          test -d dist
          grep -R "api.lulu-ai.tech/api/v1" dist/assets >/dev/null

      - name: Öffentliches Release-Manifest erzeugen
        run: |
          set -euo pipefail
          backend_version="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$API_BASE_URL/version")"
          backend_sha="$(printf '%s' "$backend_version" | jq -r '.data.commitSha // empty')"
          printf '%s' "$backend_sha" | grep -Eq '^[a-fA-F0-9]{7,64}$' || {
            echo 'The deployed backend did not expose a valid commit SHA at /version' >&2
            exit 1
          }
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg frontend "$GITHUB_SHA" \
            --arg backend "$backend_sha" \
            --arg backendVersionUrl "$API_BASE_URL/version" \
            --arg generated "$generated_at" \
            '{version:1,generatedAt:$generated,frontend:{sha:$frontend},backend:{sha:$backend,source:"api-version",versionUrl:$backendVersionUrl}}' \
            > dist/release.json
          jq -e '.version == 1 and (.frontend.sha | type == "string") and (.backend.sha | type == "string") and (.backend.versionUrl | type == "string") and (.generatedAt | type == "string")' dist/release.json >/dev/null

      - name: Frontend nach S3 synchronisieren
        env:
          FRONTEND_BUCKET: ${{ secrets.AWS_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$FRONTEND_BUCKET" || { echo 'AWS_FRONTEND_BUCKET is missing'; exit 1; }
          # HTML and release metadata are revalidated on every visit. Hashed
          # assets are immutable and should stay in the browser/CDN cache for
          # a year; otherwise every page load pays for another CDN round trip.
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET/" --delete --cache-control 'public,max-age=3600'
          aws s3 cp dist/assets/ "s3://$FRONTEND_BUCKET/assets/" --recursive \
            --cache-control 'public,max-age=31536000,immutable' \
            --metadata-directive REPLACE
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'no-cache, no-store, must-revalidate'
          # Pin the manifest metadata and verify the object exists before
          # invalidating the CDN; a missing object otherwise falls through to
          # the SPA error document and looks like a successful HTML response.
          aws s3 cp dist/release.json "s3://$FRONTEND_BUCKET/release.json" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-cache, must-revalidate'
          aws s3api head-object --bucket "$FRONTEND_BUCKET" --key release.json \
            --query '{ContentType:ContentType,ContentLength:ContentLength}' --output json | tee release-object.json
          jq -e '.ContentType | startswith("application/json") and . != ""' release-object.json >/dev/null
          jq -e '.ContentLength > 0' release-object.json >/dev/null

      - name: CloudFront-Cache leeren
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_FRONTEND_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          test -n "$DISTRIBUTION_ID" || { echo 'AWS_FRONTEND_DISTRIBUTION_ID is missing'; exit 1; }
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'

      - name: Neue Domain öffentlich prüfen
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$FRONTEND_DOMAIN/login" | grep -qi '<html'
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$API_BASE_URL/health" | grep -q '"status":"ok"'
          cors_headers="$(curl --fail --silent --show-error --retry 5 --retry-all-errors -D - -o /dev/null -X OPTIONS "$API_BASE_URL/auth/register" \
            -H 'Origin: https://lulu-ai.tech' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')"
          printf '%s\n' "$cors_headers" | grep -qi '^access-control-allow-origin: https://lulu-ai.tech'

      - name: Vollständigen öffentlichen Read-only-Smoke ausführen
        run: npm run smoke:production
