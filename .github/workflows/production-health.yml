name: AWS-Produktionsgesundheit prüfen

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Frontend und AWS-API prüfen
        env:
          # The mismatch recovery below uses GitHub CLI to inspect and, when
          # needed, dispatch the already-authorized frontend deploy workflow.
          # gh intentionally refuses to use the implicit Actions token unless
          # it is exposed explicitly through GH_TOKEN.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors https://lulu-ai.tech/login | grep -qi '<html'
          release_headers="$(mktemp)"
          release_body="$(mktemp)"
          trap 'rm -f "$release_headers" "$release_body"' EXIT
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -D "$release_headers" -o "$release_body" https://lulu-ai.tech/release.json
          grep -Eiq '^content-type: application/json([;[:space:]]|$)' "$release_headers"
          manifest_backend_sha="$(jq -r '.backend.sha' "$release_body")"
          api_version="$(curl --fail --silent --show-error --retry 3 --retry-all-errors https://api.lulu-ai.tech/api/v1/version)"
          api_backend_sha="$(printf '%s' "$api_version" | jq -r '.data.commitSha // empty')"
          test -n "$manifest_backend_sha" -a "$manifest_backend_sha" != null
          test -n "$api_backend_sha" -a "$api_backend_sha" != null
          if [ "$manifest_backend_sha" != "$api_backend_sha" ]; then
            echo "Release manifest backend SHA ($manifest_backend_sha) does not match the running API ($api_backend_sha)." >&2
            active_frontend_deploy="$(
              curl --fail --silent --show-error --retry 3 --retry-all-errors \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-frontend.yml/runs?branch=$GITHUB_REF_NAME&per_page=10" \
                | jq -r '[.workflow_runs[] | select(.status != "completed")][0].id // empty'
            )"
            if [ -z "$active_frontend_deploy" ]; then
              curl --fail --silent --show-error --retry 3 --retry-all-errors \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                -H 'Content-Type: application/json' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-frontend.yml/dispatches" \
                --data "{\"ref\":\"$GITHUB_REF_NAME\"}"
              echo 'Requested a frontend deployment to refresh the paired release manifest.' >&2
            else
              echo "Frontend deployment $active_frontend_deploy is already in progress; it will refresh the paired release manifest." >&2
            fi
            exit 1
          fi
          jq -e '
            .version == 1
            and (.generatedAt | type == "string")
            and (.frontend.sha | type == "string" and test("^[a-fA-F0-9]{7,64}$"))
            and (.backend.sha | type == "string" and test("^[a-fA-F0-9]{7,64}$"))
          ' "$release_body" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors https://api.lulu-ai.tech/api/v1/health | grep -q '"status":"ok"'
          printf '%s' "$api_version" \
            | jq -e '.success == true and (.data.commitSha | type == "string" and test("^[a-fA-F0-9]{7,64}$"))' >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors https://api.lulu-ai.tech/api/v1/ready | grep -q '"ready":true'
